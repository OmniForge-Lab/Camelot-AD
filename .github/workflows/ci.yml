name: CI Sécurité — Camelot-AD

on:
  push:
    branches: [ main, develop, "feature/**", "fix/**", "release/**" ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:

  # -----------------------------------------
  # JOB 1 — Lint & format
  # -----------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Vérifier le format (rustfmt)
        run: cargo fmt --all -- --check

      - name: Clippy pedantic
        run: cargo clippy --all-targets --all-features -- -D warnings -D clippy::pedantic

  # -----------------------------------------
  # JOB 2 — Tests unitaires
  # -----------------------------------------
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Tests
        run: cargo test --all --verbose

  # -----------------------------------------
  # JOB 3 — SAST Semgrep
  # -----------------------------------------
  semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    needs: lint
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan (règles standard)
        run: semgrep scan --config=auto --config=p/rust --error .

      - name: Semgrep scan (règles custom Camelot-AD)
        run: semgrep scan --config=.semgrep/ --error .

  # -----------------------------------------
  # JOB 4 — SCA cargo-audit
  # -----------------------------------------
  cargo-audit:
    name: SCA — cargo-audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit des dépendances
        run: cargo audit --deny warnings --deny unsound

  # -----------------------------------------
  # JOB 5 — Scan image Docker (Trivy)
  # -----------------------------------------
  trivy:
    name: Container scan — Trivy
    runs-on: ubuntu-latest
    needs: cargo-audit
    steps:
      - uses: actions/checkout@v4

      - name: Build image Docker
        run: docker build -t camelot-ad:ci .
        continue-on-error: true

      - name: Trivy scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: camelot-ad:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
        continue-on-error: true

