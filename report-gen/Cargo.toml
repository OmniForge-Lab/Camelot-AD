[package]
name = "report-gen"
version = "0.1.0"
edition = "2024"

[dependencies]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# API REST
axum = "0.7"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging structuré
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

# Crypto
ring = "0.17"
ed25519-dalek = "2"

# Base de données embarquée (audit logger)
sled = "0.34"

# Parsing
nom = "7"

# Erreurs
thiserror = "1"
anyhow = "1"